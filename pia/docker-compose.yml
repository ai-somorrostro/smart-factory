# Smart-factory monitoring stack.
# Usage:
#   cp .env.example .env
#   docker compose up -d
#


name: smart-factory

services:
  influxdb:
    image: influxdb:2.9.1
    container_name: smartek-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUXDB_INIT_USERNAME}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUXDB_INIT_PASSWORD}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUXDB_ORG}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUXDB_BUCKET_MIR}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUXDB_TOKEN}"

      INFLUXDB_ORG: "${INFLUXDB_ORG}"
      INFLUXDB_BUCKET_PRINTER: "${INFLUXDB_BUCKET_PRINTER}"
      INFLUXDB_BUCKET_DOBOT: "${INFLUXDB_BUCKET_DOBOT}"

    volumes:
      - influxdb2-data:/var/lib/influxdb2
      - ./influxdb/initdb.d:/docker-entrypoint-initdb.d

    networks:
      - factory-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nodered:
    build:
      context: ../bda/nodered
      dockerfile: DockerFile
    image: smartek-nodered:latest
    container_name: smartek-nodered
    restart: unless-stopped
    ports:
      - "${NODE_RED_PORT:-1880}:1880"

      

    environment:
      INFLUXDB_URL: "${INFLUXDB_URL:-http://influxdb:8086}"
      INFLUXDB_ORG: "${INFLUXDB_ORG}"
      INFLUXDB_BUCKET_MIR: "${INFLUXDB_BUCKET_MIR}"
      INFLUXDB_BUCKET_PRINTER: "${INFLUXDB_BUCKET_PRINTER}"
      INFLUXDB_BUCKET_DOBOT: "${INFLUXDB_BUCKET_DOBOT}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN}"
      MIR1_TOKEN: "${MIR1_TOKEN}"
      MIR2_TOKEN: "${MIR2_TOKEN}"

    volumes:
      - ../bda/nodered:/data

    networks:
      - factory-net

    depends_on:
      influxdb:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.2
    container_name: smartek-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"

    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      INFLUXDB_URL: "${INFLUXDB_URL:-http://influxdb:8086}"
      INFLUXDB_ORG: "${INFLUXDB_ORG}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN}"

      # Organizacion unica de Grafana: todo cae en la org id=1 (Smartek).
      GF_USERS_ALLOW_ORG_CREATE: "${GF_USERS_ALLOW_ORG_CREATE:-false}"
      GF_USERS_AUTO_ASSIGN_ORG: "${GF_USERS_AUTO_ASSIGN_ORG:-true}"
      GF_USERS_AUTO_ASSIGN_ORG_ID: "${GF_USERS_AUTO_ASSIGN_ORG_ID:-1}"

      #Modificación de SMTP del grafana.ini
      GF_SMTP_ENABLED: "${GF_SMTP_ENABLED}"
      GF_SMTP_HOST: "${GF_SMTP_HOST}"
      GF_SMTP_USER: "${GF_SMTP_USER}"
      GF_SMTP_PASSWORD: "${GF_SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${GF_SMTP_FROM_ADDRESS}"
      GF_SMTP_FROM_NAME: "${GF_SMTP_FROM_NAME}"
      GF_SMTP_STARTTLS_POLICY: "${GF_SMTP_STARTTLS_POLICY}"

    volumes:
      - grafana-data:/var/lib/grafana
      - ../bda/grafana/provisioning:/etc/grafana/provisioning
      - ../bda/grafana/dashboards:/var/lib/grafana/dashboards

    networks:
      - factory-net

    depends_on:
      influxdb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot idempotente: renombra la org id=1 a Smartek en cada arranque.
  # No toca influxdb, nodered ni capturadores; solo habla con Grafana.
  grafana-init-org:
    image: curlimages/curl:8.22.0
    container_name: smartek-grafana-init-org
    user : root
    entrypoint: ["sh", "/scripts/rename-org.sh"]
    restart: "no"

    environment:
      GRAFANA_URL: "${GRAFANA_URL}"
      GRAFANA_ORG_NAME: "${GRAFANA_ORG_NAME}"
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"

    volumes:
      - ./grafana-init:/scripts:ro
      - mcp-secrets:/secrets

    networks:
      - factory-net

    depends_on:
      grafana:
        condition: service_healthy
  mcp-grafana:
    image: grafana/mcp-grafana:latest
    container_name: smartek-mcp-grafana
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        export GRAFANA_SERVICE_ACCOUNT_TOKEN="$$(cat /run/mcp-secrets/GRAFANA_SERVICE_ACCOUNT_TOKEN)";
        exec /app/mcp-grafana -t streamable-http -address 0.0.0.0:8000
        --enabled-tools=search,datasource,influxdb,alerting,dashboard,folder
    environment:
      GRAFANA_URL: "http://grafana:3000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mcp-secrets:/run/mcp-secrets:ro
    networks:
      - factory-net
    depends_on:
      grafana-init-org:
        condition: service_completed_successfully
  capturar_dobot:
    build:
      context: ../sbd
      dockerfile: DockerFile
    command: ["python", "scripts/capturar_dobot.py"]
    restart: unless-stopped
    env_file:
      - ../sbd/.env

    volumes:
      - ../sbd/datos:/app/datos

    networks:
      - factory-net
  capturarr_impresora:
    build:
      context: ../sbd
      dockerfile: DockerFile
    command: ["python", "scripts/capturar_impresora.py"]
    restart: unless-stopped
    env_file:
      - ../sbd/.env
  
    volumes:
      - ../sbd/datos:/app/datos

    networks:
      - factory-net

networks:
  factory-net:
    driver: bridge

volumes:
  influxdb2-data:
  grafana-data:
  mcp-secrets: